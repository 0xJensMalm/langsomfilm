<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9ece3">
<title>Langsom Film</title>
<meta name="description" content="Langsom Film er et norsk uavhengig produksjonsselskap basert i Oslo.">
<meta property="og:title" content="Langsom Film">
<meta property="og:description" content="Et norsk uavhengig produksjonsselskap basert i Oslo.">
<meta property="og:image" content="https://0xjensmalm.github.io/langsomfilm/assets/yrkesfag.jpg">
<meta property="og:type" content="website">
<link rel="preload" href="assets/fonts/HenriksHand-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet, handmade, unhurried — the posters do the talking.
   COLOUR and TYPE: pale sage paper, dark forest-green ink; Henrik's hand for every label and title,
   a plain sans for longer reading text.
   LAYOUT: header (logo · tagline · Bio · language), a large centred poster carousel, footer (mail · turtle · Instagram). */
@font-face{font-family:"Henriks Hand";src:url("assets/fonts/HenriksHand-Regular.ttf") format("truetype");font-display:swap}
:root{color-scheme:light;--bg:#e9ece3;--paper:#f4f5ef;--ink:#1d3a2a;--soft:#5a6b5f;--line:rgba(29,58,42,.4);
  --hand:"Henriks Hand","Amatic SC","Bradley Hand",cursive; /* Amatic SC fills glyphs Henrik's hand lacks: quotes, dashes, é ü ö ä, ( ) & / @ */--sans:Montserrat,system-ui,sans-serif;--read:Newsreader,Georgia,serif}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);font-weight:500;overflow-x:clip;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:4px}
.hand{font-family:var(--hand);font-weight:400;text-transform:uppercase;letter-spacing:.14em}
.wrap{width:min(1440px,100%);margin:0 auto;padding:0 max(4vw,16px,env(safe-area-inset-left))}

/* header: brand (turtle + wordmark, subtitle aligned under the wordmark) left; contact + menu right,
   every right-hand item 44px tall and centred on the wordmark line */
header{padding:clamp(18px,2.6vw,40px) 0 clamp(8px,1.4vw,20px)}
.hd{--mark:clamp(56px,5vw,84px);--g:clamp(10px,1vw,16px);--sep:clamp(14px,1.8vw,28px);
  display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand nav" "sub .";column-gap:clamp(20px,3vw,48px);row-gap:6px;align-items:center}
.logo{grid-area:brand;justify-self:start;display:flex;align-items:center;gap:var(--g);text-decoration:none;font-family:var(--hand);font-size:clamp(28px,2.8vw,46px);line-height:1;white-space:nowrap}
.logo svg{width:var(--mark);height:auto;flex:none}
.tag{grid-area:sub;margin:0 0 0 calc(var(--mark) + var(--g));font-size:clamp(13px,1.05vw,17px);line-height:1.45;letter-spacing:.14em;text-wrap:balance}
.nav{grid-area:nav;display:flex;align-items:center}
.reach,.menu{display:flex;align-items:center}
.reach{gap:clamp(8px,1vw,14px)}
.nav>.menu,.menu>.lang{border-left:1.5px solid var(--line);margin-left:var(--sep);padding-left:var(--sep)}
.reach a,.bio-btn,.lang{height:44px;display:flex;align-items:center}
.mail{gap:10px;text-decoration:none;font-size:clamp(15px,1.25vw,19px)}
.mail:hover span,.mail:focus-visible span{text-decoration:underline;text-underline-offset:6px}
.mail svg{width:24px;height:24px;flex:none;display:none}
.ig{justify-content:center;width:44px}
.ig svg{width:28px;height:28px}
.bio-btn{background:none;border:0;padding:0 4px;font-size:clamp(20px,1.7vw,26px);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:9px}
.bio-btn:hover{text-decoration-thickness:3px}
.lang{position:relative}
.lang select{appearance:none;-webkit-appearance:none;background:none;border:0;border-radius:4px;height:44px;padding:0 24px 0 4px;font-family:var(--hand);font-size:clamp(20px,1.7vw,26px);letter-spacing:.14em}
.lang svg{position:absolute;right:2px;width:15px;height:15px;pointer-events:none}

/* carousel */
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding-block:clamp(8px,2vw,32px)}
.car{position:relative;--iw:clamp(230px,min(32vw,calc((100vh - 320px) * .7055)),410px)}
.track{display:flex;gap:clamp(16px,2.2vw,32px);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:14px max(4vw,16px) 8px;scroll-padding-inline:max(4vw,16px)}
.track::-webkit-scrollbar{display:none}
@media(min-width:1440px){.track{padding-inline:calc((100vw - 1440px)/2 + 4vw);scroll-padding-inline:calc((100vw - 1440px)/2 + 4vw)}}
.track.fits{justify-content:center}
/* 3+ posters that fit: spread them so the row's outer edges line up with the header's */
.track.fits.spread{justify-content:space-between}
.item{flex:0 0 var(--iw);scroll-snap-align:start;margin:0;display:flex;flex-direction:column;align-items:center}
.poster{display:block;width:100%;aspect-ratio:436/618;padding:0;border:0;background:#d4d9cd;border-radius:2px;overflow:hidden;box-shadow:0 14px 30px -18px rgba(20,40,28,.55);transition:transform .2s ease,box-shadow .2s ease}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
@media(hover:hover){.poster:hover{transform:translateY(-4px);box-shadow:0 22px 38px -20px rgba(20,40,28,.6)}}
.poster:active{transform:scale(.985)}
.item h2{margin:18px 0 0;width:100%;text-align:center;font-size:clamp(18px,1.6vw,24px);line-height:1.3;text-wrap:balance}
.arrow{position:absolute;top:calc(50% - 44px);width:48px;height:48px;border-radius:50%;border:1.5px solid var(--ink);background:rgba(233,236,227,.85);display:grid;place-items:center;transition:opacity .15s;z-index:2}
.arrow:hover{background:var(--paper)}
.arrow.prev{left:max(1.2vw,8px)}.arrow.next{right:max(1.2vw,8px)}
.arrow[hidden]{display:grid;opacity:0;pointer-events:none}
.arrow svg{width:20px;height:20px}
.empty{padding:60px 0;text-align:center;color:var(--soft)}
.dots{display:flex;justify-content:center;gap:2px;margin-top:14px}
.dots[hidden]{display:none}
.dots button{width:28px;height:28px;border:0;background:none;padding:0;display:grid;place-items:center}
.dots button::before{content:"";width:9px;height:9px;border-radius:50%;background:rgba(29,58,42,.25);transition:background .15s}
.dots button[aria-current="true"]::before{background:var(--ink)}

/* footer: a small turtle to end the page, and the editor link */
footer{padding:clamp(20px,3vw,40px) 0 calc(14px + env(safe-area-inset-bottom));text-align:center}
footer .tl{display:block;width:64px;height:auto;margin:0 auto}
.login-link{display:inline-block;margin:6px auto 0;text-decoration:none;font-size:13px;color:var(--soft);padding:8px}
.login-link:hover{color:var(--ink);text-decoration:underline}

/* detail sheet (film + bio) — quick fade, no 3D */
.scrim{position:fixed;inset:0;background:rgba(24,40,30,.42);z-index:20;opacity:0;transition:opacity .16s}
.sheet{--pad:24px;position:fixed;z-index:21;left:50%;top:50%;width:calc(100vw - var(--pad)*2);max-height:calc(100vh - var(--pad)*2);max-height:calc(100svh - var(--pad)*2);overflow:auto;overscroll-behavior:contain;
  background:var(--paper);border:1.5px solid var(--ink);border-radius:4px;box-shadow:0 30px 70px -30px rgba(20,40,28,.55);opacity:0;transform:translate(-50%,-48%);transition:opacity .16s ease-out,transform .16s ease-out}
.scrim.on{opacity:1}.sheet.on{opacity:1;transform:translate(-50%,-50%)}
.x{position:sticky;top:10px;float:right;margin:10px 10px -54px 0;width:44px;height:44px;border:0;border-radius:50%;background:rgba(244,245,239,.9);display:grid;place-items:center;z-index:2}
.x:hover{background:#e3e7dc}
.x svg{width:22px;height:22px}

.info{padding:clamp(22px,3.4vw,44px) clamp(20px,3.4vw,48px)}
.info h3{margin:0;font-size:clamp(32px,4.4vw,54px);line-height:1.1;padding-right:44px;overflow-wrap:anywhere}
.by{margin:10px 0 0;font-size:clamp(15px,1.4vw,19px)}
.cols{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:clamp(20px,3vw,40px);margin-top:clamp(18px,2.6vw,30px)}
.meta{border-right:1.5px solid var(--line);padding-right:clamp(16px,2.4vw,30px)}
.meta dl{margin:0}
.meta dt{font-size:15px;color:var(--soft);margin-top:14px}
.meta dl>div:first-child dt{margin-top:0}
/* card reading text: Newsreader, a quiet book serif beside Henrik's hand-lettered titles and labels */
.info{font-family:var(--read);font-weight:400;font-size:clamp(17px,1.25vw,19px);line-height:1.6;font-optical-sizing:auto}
.meta dd{margin:2px 0 0;font-size:17px;font-weight:500;line-height:1.35}
.syn p{margin:0 0 1em;max-width:60ch;text-wrap:pretty}
.stills{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,440px));gap:12px;margin-top:clamp(12px,2vw,22px)}
.stills img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;border-radius:2px}
.note{font-size:15px;font-style:italic;color:var(--soft);margin:14px 0 0}
.bio{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,3vw,44px)}
.bio>section+section{border-left:1.5px solid var(--line);padding-left:clamp(20px,3vw,44px)}
.bio h3{font-size:clamp(28px,3.2vw,40px);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:9px;padding-right:44px}
.bio h4{margin:14px 0 16px;font-size:17px}
.bio p{margin:0 0 1em}
.me{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:18px;align-items:start}
.me img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:2px;display:block;background:#d4d9cd}

/* narrower screens: the e-mail address becomes an envelope icon */
@media(max-width:1060px){
  .mail span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .mail{width:44px;justify-content:center}.mail svg{display:block}
}
@media(max-width:700px){
  header{padding:max(12px,env(safe-area-inset-top)) 0 0}
  /* two rows: brand | Bio · NO, then subtitle | mail · Instagram */
  .hd{--mark:44px;--g:8px;--sep:12px;grid-template-areas:"brand menu" "sub reach";column-gap:12px;row-gap:0}
  .nav{display:contents}
  .menu{grid-area:menu}
  .nav>.menu{border-left:0;margin-left:0;padding-left:0}
  .reach{grid-area:reach;align-self:start;justify-self:end;gap:0;margin-right:-8px}
  .logo{font-size:24px}
  .bio-btn{font-size:20px;text-underline-offset:7px}
  .lang select{font-size:18px;padding-right:20px}.lang svg{width:13px}
  .tag{align-self:start;font-size:11.5px;letter-spacing:.1em;line-height:1.5;padding-top:2px}
  .ig svg{width:24px;height:24px}
  main{justify-content:flex-start}
  /* poster sized so poster + title fit in the visible viewport, under the header */
  .car{--iw:clamp(180px,min(74vw,calc((100svh - 300px) * .7055)),360px)}
  .track{scroll-padding-inline:0;padding-inline:calc((100% - var(--iw))/2);padding-top:10px}
  .item{scroll-snap-align:center}
  .item h2{margin-top:12px;font-size:18px}
  .dots{margin-top:6px}
  .arrow{display:none!important}
  footer .tl{width:48px}
  .sheet{--pad:10px}
  .cols{grid-template-columns:minmax(0,1fr)}
  .meta{border-right:0;padding-right:0;border-bottom:1.5px solid var(--line);padding-bottom:16px}
  .meta dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
  .meta dt,.meta dl>div:first-child dt{margin-top:8px}
  .bio{grid-template-columns:minmax(0,1fr)}
  .bio>section+section{border-left:0;padding-left:0;border-top:1.5px solid var(--line);padding-top:20px}
  .me{grid-template-columns:minmax(0,120px) minmax(0,1fr)}
  .x{top:8px;margin:8px 8px -52px 0}
  .info{padding-top:20px}
}
@media(prefers-reduced-motion:reduce){.poster,.scrim,.sheet{transition:none}}
</style>
</head>
<body>
<header>
  <div class="wrap hd">
    <a class="logo" href="./" aria-label="Langsom Film"><svg viewBox="0 0 120 64" aria-hidden="true"><use href="#tl"/></svg><span>Langsom Film</span></a>
    <p class="tag hand" id="tagline"></p>
    <nav class="nav">
      <div class="reach">
        <a class="mail hand" id="mail" href="mailto:contact@langsomfilm.no"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg><span id="mailTxt">contact@langsomfilm.no</span></a>
        <a class="ig" id="igLink" href="https://www.instagram.com/" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.2" fill="currentColor" stroke="none"/></svg></a>
      </div>
      <div class="menu">
    <button class="bio-btn hand" id="bioBtn" aria-haspopup="dialog">Bio</button>
    <div class="lang"><select id="langSel" aria-label="Språk / Language"><option value="no">NO</option><option value="en">EN</option></select>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg></div>
      </div>
    </nav>
  </div>
</header>

<main>
  <div class="car">
    <div class="track" id="track" data-ta="films"></div>
    <div class="dots" id="dots"></div>
    <button class="arrow prev" id="prev" data-ta="prev"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"/></svg></button>
    <button class="arrow next" id="next" data-ta="next"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4l6 6-6 6"/></svg></button>
  </div>
</main>

<footer>
  <svg class="tl" viewBox="0 0 120 64" aria-hidden="true"><use href="#tl"/></svg>
  <a class="login-link" href="admin/" data-t="login">Logg inn</a>
</footer>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="tl" viewBox="0 0 120 64">
      <g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
        <path d="M15 43 L5 48 L16 50"/>
        <rect x="26" y="38" width="12" height="17" rx="6" style="fill:var(--bg)"/>
        <rect x="76" y="38" width="12" height="17" rx="6" style="fill:var(--bg)"/>
        <path d="M93 38 C97 24 116 22 116 35 C116 43 105 46 97 44" style="fill:var(--bg)"/>
        <circle cx="108" cy="32" r="2.2" fill="currentColor" stroke="none"/>
        <path d="M11 46 C13 14 40 6 58 6 C80 6 103 16 105 46Z" style="fill:var(--bg)"/>
        <path d="M38 13 L48 26 L41 45 M58 7 V26 M78 12 L68 26 L75 45 M48 26 H68 M28 31 L48 26 M88 31 L68 26" stroke-width="2.4"/>
      </g>
    </symbol>
  </defs>
</svg>

<script>
{
/* Content lives in content/films.json and content/site.json, edited through /admin (Sveltia CMS). */
const T={
  no:{films:'Filmer',prev:'Forrige',next:'Neste',close:'Lukk',login:'Logg inn',show:'Vis detaljer om',pick:'Velg film',
      year:'År',duration:'Varighet',lang:'Språk',regi:'Regi',manus:'Manus',cast:'Medvirkende',by:'En film av',
      more:'Mer informasjon kommer.',sample:'Eksempelinnhold — fylles ut i redigeringsmodus.',what:'Hva vi gjør',about:'Om meg',
      poster:'Plakat',still:'Stillbilde',from:'fra',portrait:'Portrett av',empty:'Ingen filmer ennå.'},
  en:{films:'Films',prev:'Previous',next:'Next',close:'Close',login:'Log in',show:'Show details for',pick:'Choose film',
      year:'Year',duration:'Runtime',lang:'Language',regi:'Director',manus:'Screenplay',cast:'Cast',by:'A film by',
      more:'More information coming soon.',sample:'Sample content — to be filled in.',what:'What we do',about:'About me',
      poster:'Poster',still:'Still',from:'from',portrait:'Portrait of',empty:'No films yet.'}
};
let state={site:{},films:[]}, lang='no';
try{lang=localStorage.getItem('langsomfilm-lang')||(/^(nb|nn|no)\b/i.test(navigator.language)?'no':'en')}catch(e){}
if(!T[lang])lang='no';
const t=k=>T[lang][k];
const L=(o,k)=>(lang==='en'&&o[k+'_en'])?o[k+'_en']:(o[k]||'');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paras=s=>String(s||'').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>';

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=lang;$('#langSel').value=lang;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll('[data-ta]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.ta)));
  $('#dots').setAttribute('aria-label',t('pick'));
  render();
}
$('#langSel').onchange=e=>{lang=e.target.value;try{localStorage.setItem('langsomfilm-lang',lang)}catch(_){}if(open)open.close(true);applyLang()};

/* ---------- render ---------- */
const track=$('#track');
function render(){
  const s=state.site;
  $('#tagline').textContent=L(s,'tagline');
  if(s.email){$('#mailTxt').textContent=s.email;$('#mail').href='mailto:'+s.email}
  $('#igLink').href=s.instagram||'https://www.instagram.com/';
  $('#dots').innerHTML='';
  track.innerHTML=state.films.map((f,i)=>`
    <figure class="item" data-i="${i}">
      <button class="poster" data-open="${i}" aria-label="${t('show')} ${esc(f.title)}"><img src="${esc(f.poster)}" alt="${t('poster')}: ${esc(f.title)}" loading="lazy"></button>
      <h2 class="hand">${esc(f.title)}</h2>
    </figure>`).join('')+(state.loaded&&!state.films.length?`<p class="empty">${t('empty')}</p>`:'');
  fit();
}
/* centre the row when every poster fits on screen */
function fit(){track.classList.remove('fits');const f=innerWidth>700&&track.scrollWidth<=track.clientWidth+2;track.classList.toggle('fits',f);track.classList.toggle('spread',f&&track.querySelectorAll('.item').length>=3);arrows()}
function arrows(){
  const overflow=track.scrollWidth>track.clientWidth+8;
  $('#prev').hidden=!overflow||track.scrollLeft<8;
  $('#next').hidden=!overflow||track.scrollLeft+track.clientWidth>=track.scrollWidth-8;
  const items=[...track.querySelectorAll('.item')];const dots=$('#dots');
  dots.hidden=items.length<2||!overflow;
  if(dots.childElementCount!==items.length)dots.innerHTML=items.map((it,k)=>`<button data-go="${k}" aria-label="${esc(state.films[k]?.title)}"></button>`).join('');
  const mid=track.getBoundingClientRect().left+track.clientWidth/2;let best=0,bd=1e9;
  items.forEach((it,k)=>{const r=it.getBoundingClientRect(),d=Math.abs(r.left+r.width/2-mid);if(d<bd){bd=d;best=k}});
  if(track.scrollLeft<8&&innerWidth>700)best=0;else if(track.scrollLeft+track.clientWidth>=track.scrollWidth-8&&innerWidth>700)best=items.length-1;
  [...dots.children].forEach((b,k)=>b.setAttribute('aria-current',k===best?'true':'false'));
}
track.addEventListener('scroll',arrows,{passive:true});addEventListener('resize',fit);
$('#dots').onclick=e=>{const b=e.target.closest('[data-go]');if(b)track.querySelector(`.item[data-i="${b.dataset.go}"]`).scrollIntoView({behavior:reduce?'auto':'smooth',inline:innerWidth>700?'start':'center',block:'nearest'})};
const step=()=>{const it=track.querySelector('.item');return it?it.getBoundingClientRect().width+parseFloat(getComputedStyle(track).columnGap||20):300};
$('#prev').onclick=()=>track.scrollBy({left:-step(),behavior:reduce?'auto':'smooth'});
$('#next').onclick=()=>track.scrollBy({left:step(),behavior:reduce?'auto':'smooth'});

/* ---------- detail sheet: quick fade in/out ---------- */
let open=null;
function openSheet({html,maxW,label,returnTo}){
  const scrim=document.createElement('div');scrim.className='scrim';
  const box=document.createElement('div');box.className='sheet';box.style.maxWidth=maxW+'px';
  box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.setAttribute('aria-label',label);
  box.innerHTML=`<button class="x" aria-label="${t('close')}">${X}</button>${html}`;
  document.body.append(scrim,box);document.body.style.overflow='hidden';
  requestAnimationFrame(()=>{scrim.classList.add('on');box.classList.add('on')});
  box.querySelector('.x').focus({preventScroll:true});
  const onKey=e=>{
    if(e.key==='Escape')close();
    if(e.key==='Tab'){const f=[...box.querySelectorAll('button,a[href]')];const a=f[0],z=f[f.length-1];
      if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
  };
  addEventListener('keydown',onKey);
  let closing=false;
  const close=(instant)=>{
    if(closing)return;closing=true;removeEventListener('keydown',onKey);
    scrim.classList.remove('on');box.classList.remove('on');
    const fin=()=>{box.remove();scrim.remove();document.body.style.overflow='';open=null;if(returnTo&&returnTo.isConnected)returnTo.focus({preventScroll:true})};
    if(reduce||instant)fin();else setTimeout(fin,170);
  };
  scrim.onclick=()=>close();box.querySelector('.x').onclick=()=>close();
  open={close};
}

function filmBack(f){
  const rows=[['year',f.year],['duration',f.duration],['lang',L(f,'lang')],['regi',f.regi],['manus',f.manus],['cast',(f.cast||'').split(',').map(s=>s.trim()).filter(Boolean).join(',\n')]].filter(r=>r[1]);
  return `<article class="info">
    <h3 class="hand">${esc(f.title)}</h3>${f.director?`<p class="by hand">${t('by')} ${esc(f.director)}</p>`:''}
    <div class="cols" ${rows.length?'':'style="grid-template-columns:minmax(0,1fr)"'}>
      ${rows.length?`<div class="meta"><dl>${rows.map(r=>`<div><dt class="hand">${t(r[0])}</dt><dd>${esc(r[1]).replace(/\n/g,'<br>')}</dd></div>`).join('')}</dl></div>`:''}
      <div class="syn">${paras(L(f,'synopsis'))||`<p>${t('more')}</p>`}${f.sample?`<p class="note">${t('sample')}</p>`:''}</div>
    </div>
    ${f.stills&&f.stills.length?`<div class="stills">${f.stills.map((s,k)=>`<img src="${esc(s)}" alt="${t('still')} ${k+1} ${t('from')} ${esc(f.title)}" loading="lazy">`).join('')}</div>`:''}
  </article>`;
}
function openFilm(i){
  const f=state.films[i];
  openSheet({html:filmBack(f),maxW:960,label:f.title,returnTo:track.querySelector(`.item[data-i="${i}"] .poster`)});
}
function bioBack(){
  const s=state.site;
  return `<div class="info bio">
    <section><h3 class="hand">Langsom Film</h3><h4 class="hand">${t('what')}</h4>${paras(L(s,'company'))}</section>
    <section><h3 class="hand">${esc(s.name)}</h3><h4 class="hand">${t('about')}</h4><div class="me">${s.portrait?`<img src="${esc(s.portrait)}" alt="${t('portrait')} ${esc(s.name)}">`:'<div></div>'}<div>${paras(L(s,'about'))}</div></div></section>
  </div>`;
}
$('#bioBtn').onclick=()=>openSheet({html:bioBack(),maxW:1000,label:'Bio',returnTo:$('#bioBtn')});

/* ---------- carousel clicks ---------- */
track.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)openFilm(+b.dataset.open)});

/* ---------- load content ---------- */
const get=u=>fetch(u,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.json()});
Promise.all([get('content/site.json'),get('content/films.json')])
  .then(([site,f])=>{state={site,films:(f.films||[]).filter(x=>x&&x.title&&x.poster),loaded:true};render()})
  .catch(err=>{console.error(err);track.innerHTML='<p class="empty">Kunne ikke laste innholdet. Prøv å laste siden på nytt.</p>'});
applyLang();
}
</script>
</body>
